{% extends 'base.html' %}

{% block extra_css %}
<style>
    .blog-post {
        margin-bottom: 2rem;
    }
    .blog-post img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin-bottom: 1rem;
    }
    .blog-actions {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid #eee;
    }
    .post-meta {
        color: #6c757d;
        font-size: 0.9rem;
        margin-bottom: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container my-4">
    {% block blog_content %}
    {% endblock %}
</div>
{% endblock %}

{% block extra_js %}
<script>
    // JavaScript для блога можно добавить здесь
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Блог загружен');
    });
</script>
{% endblock %}
